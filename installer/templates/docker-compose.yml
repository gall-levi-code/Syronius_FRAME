name: syronius-frame

services:
  frame-edge:
    image: traefik@sha256:cc1799c50550f730f686df9b368e690f9199542787db8d1dd328a7c3779f6eea
    container_name: frame-edge
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.web.address=:80
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --ping=true
      - --ping.entrypoint=web
      - --providers.docker.endpoint=tcp://frame-docker-proxy:2375
      - --providers.docker.constraints=Label(`com.docker.compose.project`,`syronius-frame`)
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=frame-internal
      - --providers.docker.watch=true
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.queryparameters.defaultmode=drop
    ports:
      - "${EDGE_HTTP_PORT:-80}:80"
    depends_on:
      frame-auth:
        condition: service_healthy
      frame-docker-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - frame-internal

  frame-auth:
    build:
      context: ./services/frame-auth
    container_name: frame-auth
    restart: unless-stopped
    environment:
      PORT: 3740
      FRAME_AUTH_SESSION_SECRET: ${FRAME_AUTH_SESSION_SECRET}
      FRAME_AUTH_SESSION_DAYS: ${FRAME_AUTH_SESSION_DAYS:-7}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      STREAMS_USERNAME: ${STREAMS_USERNAME:-}
      STREAMS_PASSWORD: ${STREAMS_PASSWORD:-}
      OVERLAYS_USERNAME: ${OVERLAYS_USERNAME:-}
      OVERLAYS_PASSWORD: ${OVERLAYS_PASSWORD:-}
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-auth.entrypoints: web
      traefik.http.routers.frame-auth.priority: "300"
      traefik.http.routers.frame-auth.rule: PathPrefix(`/auth`)
      traefik.http.routers.frame-auth.service: frame-auth
      traefik.http.services.frame-auth.loadbalancer.server.port: "3740"
      traefik.http.middlewares.frame-sso.forwardauth.address: http://frame-auth:3740/auth/check
      traefik.http.middlewares.frame-sso.forwardauth.trustForwardHeader: "true"
      traefik.http.middlewares.frame-sso.forwardauth.maxResponseBodySize: "65536"
      traefik.http.middlewares.frame-sso.forwardauth.authResponseHeaders: Authorization,X-Frame-Authenticated-User
    networks:
      - frame-internal

  frame-public-gateway:
    profiles: ["hybrid"]
    image: traefik@sha256:cc1799c50550f730f686df9b368e690f9199542787db8d1dd328a7c3779f6eea
    container_name: frame-public-gateway
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entrypoints.public.address=:8080
      - --entrypoints.health.address=:8081
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --providers.file.filename=/etc/frame/public-routes.yml
      - --providers.file.watch=false
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.fields.queryparameters.defaultmode=drop
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/state/public-routes.yml:/etc/frame/public-routes.yml:ro
    depends_on:
      frame-edge:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/__frame_gateway_health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - frame-internal

  frame-tunnel:
    profiles: ["hybrid"]
    image: cloudflare/cloudflared@sha256:ba461b8aa9c042156dbd39c38657fe7431bafa063220eab8d5330a523863da9f
    container_name: frame-tunnel
    restart: unless-stopped
    command:
      - tunnel
      - --loglevel
      - info
      - --metrics
      - 0.0.0.0:2000
      - run
      - --token-file
      - /run/secrets/cloudflare-tunnel-token
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/state/cloudflare-tunnel-token:/run/secrets/cloudflare-tunnel-token:ro
    depends_on:
      frame-public-gateway:
        condition: service_healthy
    networks:
      - frame-internal

  frame-portal:
    build:
      context: ./services/frame-portal
    container_name: frame-portal
    restart: unless-stopped
    environment:
      PORT: 3730
      FRAME_MODE: ${FRAME_MODE:-LAN}
      DATA_ROOT: /data
      STACK_CONFIG_PATH: /data/state/stack-config.json
      DOCKER_HOST: http://frame-docker-proxy:2375
      DOCKER_COMPOSE_PROJECT: syronius-frame
      ENABLE_CONTAINER_RESTARTS: ${ENABLE_CONTAINER_RESTARTS:-false}
      STATUS_REFRESH_MS: ${STATUS_REFRESH_MS:-5000}
      STATUS_CACHE_MS: ${STATUS_CACHE_MS:-4000}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
      AUDIO_BRIDGE_STATUS_URL: http://frame-audio-bridge:3728/api/internal/portal-status
      AUDIO_BRIDGE_STATUS_TOKEN: ${PORTAL_SERVICE_TOKEN}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      PORTAL_REALM: ${PORTAL_REALM:-FRAME Portal}
      DISK_WARN_PERCENT: ${DISK_WARN_PERCENT:-85}
      DISK_ERROR_PERCENT: ${DISK_ERROR_PERCENT:-95}
      DISK_MINIMUM_FREE_GB: ${DISK_MINIMUM_FREE_GB:-20}
    ports:
      - "${PORTAL_PORT:-3730}:3730"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}:/data:ro
    depends_on:
      frame-docker-proxy:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-portal.entrypoints: web
      traefik.http.routers.frame-portal.priority: "1"
      traefik.http.routers.frame-portal.rule: PathPrefix(`/`)
      traefik.http.routers.frame-portal.middlewares: frame-sso
      traefik.http.routers.frame-portal.service: frame-portal
      traefik.http.routers.frame-portal-public.entrypoints: web
      traefik.http.routers.frame-portal-public.priority: "200"
      traefik.http.routers.frame-portal-public.rule: Path(`/healthz`) || PathPrefix(`/assets`)
      traefik.http.routers.frame-portal-public.service: frame-portal
      traefik.http.services.frame-portal.loadbalancer.server.port: "3730"
    networks:
      - frame-internal

  frame-docker-proxy:
    image: tecnativa/docker-socket-proxy@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    container_name: frame-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      EVENTS: 1
      INFO: 1
      NETWORKS: 1
      PING: 1
      POST: ${DOCKER_PROXY_POST:-0}
      VERSION: 1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - frame-internal

  frame-audio-bridge:
    profiles: ["audio-bridge"]
    build:
      context: ./services/frame-audio-bridge
    container_name: frame-audio-bridge
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
      PORT: 3728
      SESSION_SECRET: ${SESSION_SECRET}
      DEFAULT_AUDIO_DELAY_MS: ${DEFAULT_AUDIO_DELAY_MS:-2000}
      MAX_AUDIO_DELAY_MS: ${MAX_AUDIO_DELAY_MS:-10000}
      SESSION_IDLE_TIMEOUT_MINUTES: ${SESSION_IDLE_TIMEOUT_MINUTES:-30}
      READONLY_OBS_TOKEN: ${READONLY_OBS_TOKEN:-}
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN}
      DATA_DIR: /data
    ports:
      - "${AUDIO_BRIDGE_PORT:-3729}:3728"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/audio-bridge:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-audio-bridge.entrypoints: web
      traefik.http.routers.frame-audio-bridge.priority: "100"
      traefik.http.routers.frame-audio-bridge.rule: PathPrefix(`/bridge`)
      traefik.http.services.frame-audio-bridge.loadbalancer.server.port: "3728"
    networks:
      - frame-internal

  frame-audio:
    profiles: ["audio-monitor"]
    build:
      context: ./services/frame-audio
    container_name: frame-audio
    restart: unless-stopped
    environment:
      PORT: 3734
      DATA_ROOT: /data
      PUBLIC_BASE_URL: ${AUDIO_PUBLIC_BASE_URL:-http://localhost}
      CAPTURE_BASE_URL: ${AUDIO_CAPTURE_BASE_URL:-${AUDIO_PUBLIC_BASE_URL:-http://localhost}}
      FFMPEG_PATH: ffmpeg
    ports:
      - "${AUDIO_MONITOR_PORT:-3734}:3734"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/audio-monitor:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-audio.entrypoints: web
      traefik.http.routers.frame-audio.priority: "100"
      traefik.http.routers.frame-audio.rule: PathPrefix(`/audio`)
      traefik.http.routers.frame-audio.service: frame-audio
      traefik.http.routers.frame-audio-admin.entrypoints: web
      traefik.http.routers.frame-audio-admin.priority: "200"
      traefik.http.routers.frame-audio-admin.rule: Path(`/audio`) || Path(`/audio/admin`) || PathPrefix(`/audio/api`) || PathPrefix(`/audio/capture`)
      traefik.http.routers.frame-audio-admin.middlewares: frame-sso
      traefik.http.routers.frame-audio-admin.service: frame-audio
      traefik.http.services.frame-audio.loadbalancer.server.port: "3734"
    networks:
      - frame-internal

  frame-ingest-video:
    profiles: ["video-relay"]
    build:
      context: ./services/frame-ingest-video
    container_name: frame-ingest-video
    restart: unless-stopped
    environment:
      SLS_API_KEY: ${SLS_API_KEY}
    ports:
      - "${SRTLA_PORT:-5000}:5000/udp"
      - "${SRT_PLAYER_PORT:-4000}:4000/udp"
      - "${SRT_SENDER_PORT:-4001}:4001/udp"
      - "${SLS_STATS_PORT:-8080}:8080/tcp"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/video-relay:/var/lib/sls
    networks:
      - frame-internal

  frame-pipeline-photos:
    profiles: ["photo-pipeline"]
    build:
      context: ./services/frame-pipeline-photos
    container_name: frame-pipeline-photos
    restart: unless-stopped
    environment:
      PORT: 3735
      DATA_ROOT: /data
      HOST_DATA_ROOT: ${FRAME_HOST_DATA_ROOT:-/data}
      TIMEZONE: ${TIMEZONE:-America/Chicago}
      PIPELINE_POLL_MS: ${PIPELINE_POLL_MS:-1000}
      PIPELINE_CONCURRENCY: ${PIPELINE_CONCURRENCY:-2}
      PHOTO_MAX_INPUT_MB: ${PHOTO_MAX_INPUT_MB:-50}
      PHOTO_MAX_MEGAPIXELS: ${PHOTO_MAX_MEGAPIXELS:-80}
      PHOTO_CONVERSION_ATTEMPTS: ${PHOTO_CONVERSION_ATTEMPTS:-3}
      PHOTO_ARCHIVE_ORIGINALS: ${PHOTO_ARCHIVE_ORIGINALS:-true}
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN}
    volumes:
      - ${FRAME_DATA_ROOT:-./data}:/data
    networks:
      - frame-internal

  frame-photo-upload:
    profiles: ["photo-webupload"]
    build:
      context: ./services/frame-photo-upload
    container_name: frame-photo-upload
    restart: unless-stopped
    environment:
      PORT: 3736
      DATA_ROOT: /data
      PHOTO_MAX_INPUT_MB: ${PHOTO_MAX_INPUT_MB:-50}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      PORTAL_REALM: ${PORTAL_REALM:-FRAME Portal}
    ports:
      - "${PHOTO_UPLOAD_PORT:-3736}:3736"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}:/data
    depends_on:
      frame-pipeline-photos:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-photo-upload.entrypoints: web
      traefik.http.routers.frame-photo-upload.priority: "100"
      traefik.http.routers.frame-photo-upload.rule: PathPrefix(`/photos`)
      traefik.http.routers.frame-photo-upload.middlewares: frame-sso
      traefik.http.services.frame-photo-upload.loadbalancer.server.port: "3736"
    networks:
      - frame-internal

  frame-photo-ftp:
    profiles: ["photo-ftp"]
    build:
      context: ./services/frame-photo-ftp
    container_name: frame-photo-ftp
    restart: unless-stopped
    environment:
      PORT: 3737
      DATA_ROOT: /data
      PHOTO_FTP_PORT: 2121
      PHOTO_FTP_USERNAME: ${PHOTO_FTP_USERNAME:-frame}
      PHOTO_FTP_PASSWORD: ${PHOTO_FTP_PASSWORD:-}
      PHOTO_FTP_PASSIVE_HOST: ${PHOTO_FTP_PASSIVE_HOST:-127.0.0.1}
      PHOTO_FTP_PASSIVE_MIN: ${PHOTO_FTP_PASSIVE_MIN:-30000}
      PHOTO_FTP_PASSIVE_MAX: ${PHOTO_FTP_PASSIVE_MAX:-30009}
      PHOTO_FTP_STABLE_MS: ${PHOTO_FTP_STABLE_MS:-3000}
      PHOTO_FTP_SCAN_MS: ${PHOTO_FTP_SCAN_MS:-1000}
    ports:
      - "${PHOTO_FTP_PORT:-2121}:2121"
      - "${PHOTO_FTP_PASSIVE_MIN:-30000}-${PHOTO_FTP_PASSIVE_MAX:-30009}:${PHOTO_FTP_PASSIVE_MIN:-30000}-${PHOTO_FTP_PASSIVE_MAX:-30009}"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}:/data
    depends_on:
      frame-pipeline-photos:
        condition: service_healthy
    networks:
      - frame-internal

  frame-gallery:
    profiles: ["photo-gallery"]
    build:
      context: ./services/frame-gallery
    container_name: frame-gallery
    restart: unless-stopped
    environment:
      PORT: 3738
      DATA_ROOT: /data
      GALLERY_THUMB_WIDTH: ${GALLERY_THUMB_WIDTH:-720}
      GALLERY_THUMB_QUALITY: ${GALLERY_THUMB_QUALITY:-82}
      PHOTO_PIPELINE_URL: http://frame-pipeline-photos:3735
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      PORTAL_REALM: ${PORTAL_REALM:-FRAME Portal}
    ports:
      - "${GALLERY_PORT:-3738}:3738"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/galleries:/data/galleries:ro
      - ${FRAME_DATA_ROOT:-./data}/gallery-cache:/data/gallery-cache
    depends_on:
      frame-pipeline-photos:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-gallery.entrypoints: web
      traefik.http.routers.frame-gallery.priority: "110"
      traefik.http.routers.frame-gallery.rule: PathPrefix(`/gallery`) || PathPrefix(`/today/gallery`)
      traefik.http.services.frame-gallery.loadbalancer.server.port: "3738"
      traefik.http.routers.frame-gallery-admin.entrypoints: web
      traefik.http.routers.frame-gallery-admin.priority: "220"
      traefik.http.routers.frame-gallery-admin.rule: PathPrefix(`/gallery/admin`) || PathPrefix(`/today/gallery/admin`)
      traefik.http.routers.frame-gallery-admin.middlewares: frame-sso
      traefik.http.routers.frame-gallery-admin.service: frame-gallery
    networks:
      - frame-internal

  frame-today:
    profiles: ["photo-today"]
    build:
      context: ./services/frame-today
    container_name: frame-today
    restart: unless-stopped
    environment:
      PORT: 3739
      DATA_ROOT: /data
      TODAY_DEFAULT_INTERVAL_MS: ${TODAY_DEFAULT_INTERVAL_MS:-10000}
      TODAY_REFRESH_MS: ${TODAY_REFRESH_MS:-1000}
      PORTAL_USERNAME: ${PORTAL_USERNAME:-}
      PORTAL_PASSWORD: ${PORTAL_PASSWORD:-}
      PORTAL_REALM: ${PORTAL_REALM:-FRAME Portal}
    ports:
      - "${TODAY_PORT:-3739}:3739"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/galleries:/data/galleries:ro
      - ${FRAME_DATA_ROOT:-./data}/state:/data/state:ro
    depends_on:
      frame-pipeline-photos:
        condition: service_healthy
      frame-gallery:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-today.entrypoints: web
      traefik.http.routers.frame-today.priority: "100"
      traefik.http.routers.frame-today.rule: PathPrefix(`/today`)
      traefik.http.routers.frame-today.service: frame-today
      traefik.http.routers.frame-today-control.entrypoints: web
      traefik.http.routers.frame-today-control.priority: "200"
      traefik.http.routers.frame-today-control.rule: Path(`/today/remote`) || Path(`/today/api/command`) || Path(`/today/ws/control`)
      traefik.http.routers.frame-today-control.middlewares: frame-sso
      traefik.http.routers.frame-today-control.service: frame-today
      traefik.http.services.frame-today.loadbalancer.server.port: "3739"
    networks:
      - frame-internal

  frame-streams:
    profiles: ["video-relay", "overlays"]
    build:
      context: ./services/frame-streams
    container_name: frame-streams
    restart: unless-stopped
    environment:
      PORT: 3732
      DATA_ROOT: /data
      SLS_API_URL: http://frame-ingest-video:8080
      SLS_API_KEY: ${SLS_API_KEY}
      PUBLIC_RELAY_HOST: ${PUBLIC_RELAY_HOST:-localhost}
      SRTLA_PORT: ${SRTLA_PORT:-5000}
      SRT_PLAYER_PORT: ${SRT_PLAYER_PORT:-4000}
      SRT_SENDER_PORT: ${SRT_SENDER_PORT:-4001}
      SLS_STATS_PORT: ${SLS_STATS_PORT:-8080}
      OVERLAY_WIZARD_URL: ${EDGE_PUBLIC_BASE_URL:-http://localhost}/overlays/setup
      OVERLAYS_API_URL: http://frame-overlays:3733
      STREAMS_USERNAME: ${STREAMS_USERNAME:-}
      STREAMS_PASSWORD: ${STREAMS_PASSWORD:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
    ports:
      - "${STREAMS_PORT:-3732}:3732"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/streams:/data
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-streams.entrypoints: web
      traefik.http.routers.frame-streams.priority: "100"
      traefik.http.routers.frame-streams.rule: PathPrefix(`/slsui`)
      traefik.http.routers.frame-streams.middlewares: frame-sso
      traefik.http.services.frame-streams.loadbalancer.server.port: "3732"
    networks:
      - frame-internal

  frame-overlays:
    profiles: ["overlays"]
    build:
      context: ./services/frame-overlays
    container_name: frame-overlays
    restart: unless-stopped
    environment:
      PORT: 3733
      DATA_ROOT: /data
      STREAMS_API_URL: http://frame-streams:3732
      SLS_API_KEY: ${SLS_API_KEY}
      PUBLIC_BASE_URL: ${OVERLAYS_PUBLIC_BASE_URL:-http://localhost}
      OVERLAYS_USERNAME: ${OVERLAYS_USERNAME:-}
      OVERLAYS_PASSWORD: ${OVERLAYS_PASSWORD:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-3000}
    ports:
      - "${OVERLAYS_PORT:-3733}:3733"
    volumes:
      - ${FRAME_DATA_ROOT:-./data}/overlays:/data
    depends_on:
      frame-streams:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.http.routers.frame-overlays.entrypoints: web
      traefik.http.routers.frame-overlays.priority: "100"
      traefik.http.routers.frame-overlays.rule: PathPrefix(`/overlays`)
      traefik.http.routers.frame-overlays.service: frame-overlays
      traefik.http.routers.frame-overlays-management.entrypoints: web
      traefik.http.routers.frame-overlays-management.priority: "200"
      traefik.http.routers.frame-overlays-management.rule: Path(`/overlays`) || Path(`/overlays/setup`) || PathPrefix(`/overlays/api`)
      traefik.http.routers.frame-overlays-management.middlewares: frame-sso
      traefik.http.routers.frame-overlays-management.service: frame-overlays
      traefik.http.services.frame-overlays.loadbalancer.server.port: "3733"
    networks:
      - frame-internal

networks:
  frame-internal:
    name: frame-internal
