<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#02080c">
    <title>FRAME Photo Stage Viewer</title>
    <link rel="icon" href="/today/assets/frame-logo-square.svg" type="image/svg+xml">
    <script src="/assets/frame-theme.js?v=global-theme-v1"></script>
    <link rel="stylesheet" href="/today/assets/today.css?v=full-image-viewer-1">
  </head>
  <body class="viewer-page">
    <main class="viewer" aria-live="polite">
      <div id="viewer-empty" class="viewer-empty">
        <img src="/today/assets/frame-logo-square.svg" alt="">
        <strong>Waiting for the first staged photo</strong>
        <span>Published photos appear automatically.</span>
      </div>
      <div id="photo-stage" class="photo-stage" role="img" hidden>
        <div id="photo-current" class="photo-layer current"></div>
        <div id="photo-next" class="photo-layer next"></div>
      </div>
      <section id="exif-panel" class="exif-panel" hidden>
        <div class="exif-heading">
          <span>Camera information</span>
          <strong id="photo-name"></strong>
        </div>
        <pre id="camera-text"></pre>
        <span id="photo-details" class="photo-details"></span>
      </section>
      <div id="viewer-status" class="viewer-status">Connecting</div>
    </main>
    <script type="module" src="/today/assets/viewer.js?v=full-image-viewer-1"></script>
  </body>
</html>
