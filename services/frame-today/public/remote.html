<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071923">
    <title>FRAME Photo Stage Remote</title>
    <link rel="icon" href="/today/assets/frame-logo-square.svg" type="image/svg+xml">
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const key = (value) => String(value).replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
          const aliases = { page: ["page", "bg", "background"], panel: ["panel", "topbar"], panelStrong: ["panel-2", "surface", "surface-strong", "control"], panelMuted: ["panel-muted", "queue"], border: ["border", "line"], borderSoft: ["border-soft"], label: ["label", "muted"], text: ["text", "control-text"], accent: ["accent"], accentStrong: ["accent-strong"], accentSoft: ["accent-soft"], accentBorder: ["accent-border"], accentContrast: ["accent-contrast", "action-text"], danger: ["danger", "bad"], warning: ["warning", "warn"], good: ["good"], toggleNightBg: ["toggle-night-bg"], toggleNightText: ["toggle-night-text"], toggleDayBg: ["toggle-day-bg"], toggleDayText: ["toggle-day-text"] };
          window.FrameTheme = { apply(mode) {
            const stored = mode || localStorage.getItem("frame-theme") || localStorage.getItem("frame-gallery-theme-mode") || localStorage.getItem("frame-audio-bridge-color-mode");
            const theme = stored === "day" || stored === "night" ? stored : "night";
            root.dataset.theme = theme;
            root.dataset.themeMode = theme;
            const palette = JSON.parse(localStorage.getItem("frame-theme-profile") || "null")?.palettes?.[theme];
            if (!palette) return;
            Object.entries(palette).forEach(([name, color]) => {
              root.style.setProperty(`--frame-${key(name)}`, color);
              (aliases[name] || []).forEach((alias) => root.style.setProperty(`--${alias}`, color));
            });
          } };
          window.FrameTheme.apply();
        } catch {}
      })();
    </script>
    <script src="/assets/frame-theme.js?v=global-theme-v1"></script>
    <link rel="stylesheet" href="/today/assets/today.css?v=collapsible-remote-header-1">
  </head>
  <body class="tool-page remote-page">
    <header class="topbar remote-topbar">
      <a class="brand" href="/today/dashboard" aria-label="Open Photo Stage Dashboard">
        <img src="/today/assets/frame-logo-square.svg" alt="FRAME">
        <span><small>Syronius FRAME</small><strong>Photo Stage Remote</strong></span>
      </a>
      <div class="header-actions">
        <span id="remote-connection" class="connection-led" role="status" aria-label="Connecting" title="Connecting"></span>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <a class="icon-button" href="/today/dashboard">Dashboard</a>
      </div>
      <button id="header-collapse" class="header-collapse" type="button" aria-label="Collapse header" aria-expanded="true" title="Collapse header">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 14 5-5 5 5"/></svg>
      </button>
    </header>
    <main class="remote-main">
      <section class="current-card">
        <div id="remote-preview" class="remote-preview">
          <img id="remote-image" alt="" hidden>
          <span id="remote-empty">Waiting for a published photo</span>
          <button data-command="PREV" class="preview-nav previous" type="button" aria-label="Previous photo">&larr;</button>
          <button data-command="NEXT" class="preview-nav next" type="button" aria-label="Next photo">&rarr;</button>
          <span id="playback-progress" class="playback-progress" hidden></span>
        </div>
        <div class="current-copy">
          <span id="position">0 of 0</span>
          <strong id="current-name">No photo selected</strong>
          <pre id="remote-camera"></pre>
        </div>
      </section>

      <section class="control-panel">
        <div class="action-controls" role="group" aria-label="Stage controls">
          <button id="play" class="action-button play" type="button" aria-label="Play slideshow" title="Play slideshow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button>
          <button id="pause" class="action-button pause" type="button" aria-label="Pause slideshow" title="Pause slideshow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h4v14H7zM14 5h4v14h-4z"/></svg></button>
          <button id="stop" class="action-button stop" type="button" aria-label="Stop slideshow" title="Stop slideshow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h12v12H6z"/></svg></button>
          <button id="auto-scroll" class="action-button" type="button" aria-label="Scroll image once" title="Scroll image once"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="10" height="18" rx="1"/><path d="m18 7 2-2 2 2M20 5v14m-2-2 2 2 2-2"/></svg></button>
          <button id="exif-toggle" class="action-button" type="button" aria-label="Toggle camera information" title="Camera information" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h4l2-3h4l2 3h4v11H4Z"/><circle cx="12" cy="13" r="3"/></svg></button>
          <button id="thumbnails-toggle" class="action-button" type="button" aria-label="Choose from thumbnails" title="Thumbnails" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></button>
          <button id="background-toggle" class="action-button" type="button" aria-label="Toggle viewer background" title="Viewer background" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 15 8 10l4 4 3-3 6 6"/></svg></button>
        </div>
        <label class="slider-row" for="interval">
          <span><strong>Image duration</strong><output id="interval-value">10 seconds</output></span>
          <input id="interval" type="range" min="0" max="14" step="1" value="7" aria-valuetext="10 seconds">
        </label>
      </section>

      <section id="thumbnail-section" class="thumbnail-section" role="dialog" aria-label="Choose a stage photo" hidden>
        <div class="section-heading">
          <div><strong>Stage photos</strong><span id="photo-count">0 photos</span></div>
          <button id="thumbnails-close" class="drawer-close" type="button" aria-label="Close thumbnails">&times;</button>
        </div>
        <div id="thumbnails" class="thumbnail-list"></div>
      </section>
      <p id="remote-message" class="remote-message" role="status"></p>
    </main>
    <script type="module" src="/today/assets/remote.js?v=collapsible-remote-header-1"></script>
  </body>
</html>
