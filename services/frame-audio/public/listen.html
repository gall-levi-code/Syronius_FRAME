<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRAME Audio Listener</title>
    <link rel="icon" href="/audio/assets/frame-logo-square.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/audio/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/audio/assets/frame-logo-square.svg" alt="FRAME"><div><strong>Audio Monitor</strong><span>Remote listener</span></div></div>
      <div class="top-actions"><button id="theme-toggle" class="icon-button">Theme</button></div>
    </header>
    <div class="listen-shell">
      <main class="listen-card">
        <div class="listen-status"><div><h1 id="source-name">Loading audio source</h1><p id="source-state">Connecting</p></div><span id="status-pill" class="status-pill">Waiting</span></div>
        <audio id="player" controls playsinline preload="auto"></audio>
        <button id="listen-button">Tap to listen</button>
        <p id="playback-error" class="notice hidden"></p>
        <label>Playback stability
          <select id="buffer-profile">
            <option value="low">Low latency - about 3 seconds</option>
            <option value="balanced" selected>Balanced - about 6 seconds</option>
            <option value="stable">Stable - about 12 seconds</option>
          </select>
          <small>More buffer increases delay but better absorbs Wi-Fi and network timing changes.</small>
        </label>
        <div class="capture-grid">
          <div class="capture-stat"><span>Relay</span><strong id="relay-mode">--</strong></div>
          <div class="capture-stat"><span>Bitrate</span><strong id="bitrate">--</strong></div>
          <div class="capture-stat"><span>Listeners</span><strong id="listeners">--</strong></div>
          <div class="capture-stat"><span>Playback</span><strong id="playback-state">Waiting</strong></div>
          <div class="capture-stat"><span>Buffered locally</span><strong id="buffered-seconds">0.0 s</strong></div>
          <div class="capture-stat"><span>Behind live</span><strong id="live-latency">--</strong></div>
        </div>
        <p class="muted">This page follows relay generation changes automatically. Balanced or Stable mode is recommended when listening over Wi-Fi.</p>
      </main>
    </div>
    <script src="/audio/assets/hls.min.js"></script>
    <script src="/audio/assets/listen.js" defer></script>
  </body>
</html>
