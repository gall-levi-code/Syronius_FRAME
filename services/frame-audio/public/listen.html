<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRAME Audio Listener</title>
    <link rel="icon" href="/audio/assets/frame-logo-square.svg" type="image/svg+xml">
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const key = (value) => String(value).replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
          const aliases = { page: ["page", "bg", "background"], panel: ["panel", "topbar"], panelStrong: ["panel-2", "surface", "surface-strong", "control"], panelMuted: ["panel-muted", "queue"], border: ["border", "line"], borderSoft: ["border-soft"], label: ["label", "muted"], text: ["text", "control-text"], accent: ["accent"], accentStrong: ["accent-strong"], accentSoft: ["accent-soft"], accentBorder: ["accent-border"], accentContrast: ["accent-contrast", "action-text"], danger: ["danger", "bad"], warning: ["warning", "warn"], good: ["good"], toggleNightBg: ["toggle-night-bg"], toggleNightText: ["toggle-night-text"], toggleDayBg: ["toggle-day-bg"], toggleDayText: ["toggle-day-text"] };
          window.FrameTheme = { apply(mode) {
            const stored = mode || localStorage.getItem("frame-theme") || localStorage.getItem("frame-gallery-theme-mode");
            const theme = stored === "day" || stored === "night" ? stored : "night";
            root.dataset.theme = theme;
            root.dataset.themeMode = theme;
            const palette = JSON.parse(localStorage.getItem("frame-theme-profile") || "null")?.palettes?.[theme];
            if (!palette) return;
            Object.entries(palette).forEach(([name, color]) => {
              root.style.setProperty(`--frame-${key(name)}`, color);
              (aliases[name] || []).forEach((alias) => root.style.setProperty(`--${alias}`, color));
            });
          } };
          window.FrameTheme.apply();
        } catch {}
      })();
    </script>
    <script src="/assets/frame-theme.js?v=global-theme-v1"></script>
    <link rel="stylesheet" href="/audio/assets/styles.css?v=frame-theme-tab">
    <link rel="stylesheet" href="/assets/frame-tools.css?v=tool-identity-v1-feedback-v1">
    <link rel="stylesheet" href="/assets/frame-feedback.css?v=feedback-v1">
  </head>
  <body data-frame-tool="audio">
    <header class="topbar">
      <div class="brand">
        <svg class="frame-tool-emblem" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="12" width="4" height="8" rx="1.5"/><rect x="17" y="12" width="4" height="8" rx="1.5"/></svg>
        <div class="frame-header-copy"><strong class="frame-header-title">Audio Listener</strong><span class="frame-header-description">Listen to your remote audio sources</span></div>
      </div>
      <div class="top-actions frame-header-actions">
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <div class="listen-shell">
      <main class="listen-card">
        <div class="listen-status"><div><h1 id="source-name">Loading audio source</h1><p id="source-state">Connecting</p></div><span hidden id="status-pill" class="status-pill">Waiting</span></div>
        <audio id="player" playsinline crossorigin="anonymous" preload="none"></audio>
        <section class="monitor-player" aria-label="Audio monitor player">
          <div class="player-primary">
            <button id="play-button" class="play-button" type="button" data-action="play">
              <span id="play-button-label">Play</span>
            </button>
            <div class="player-now">
              <span>Playback</span>
              <strong id="playback-state">Waiting</strong>
            </div>
            <button id="mute-button" class="secondary" type="button" aria-pressed="false">Mute</button>
          </div>
          <div class="timeline-head">
            <span>Active buffer</span>
            <strong id="buffer-window-label">20 s rolling</strong>
          </div>
          <div id="live-timeline" class="live-timeline" aria-label="Rolling live buffer">
            <div id="timeline-available" class="timeline-available"></div>
            <div id="timeline-buffer" class="timeline-buffer"></div>
            <div id="timeline-target" class="timeline-marker timeline-target"></div>
            <div id="timeline-playhead" class="timeline-marker timeline-playhead"></div>
            <div class="timeline-marker timeline-live"></div>
          </div>
          <div class="timeline-scale" aria-hidden="true"><span>-20 s</span><span id="safe-target-label">6 s safe</span><span>Live</span></div>
          <label class="volume-control">Volume
            <input id="volume-slider" type="range" min="0" max="100" value="100" step="1">
            <strong id="volume-value">100%</strong>
          </label>
        </section>
        <p hidden id="playback-error" class="notice hidden"></p>
        <label>Playback stability
          <select id="buffer-profile">
            <option value="near">Near realtime - about 1.5 seconds</option>
            <option value="low">Low latency - about 3 seconds</option>
            <option value="balanced" selected>Balanced - about 6 seconds</option>
            <option value="stable">Stable - about 12 seconds</option>
          </select>
          <small>More buffer increases delay but better absorbs Wi-Fi and network timing changes.</small>
        </label>
        <div class="capture-grid">
          <div class="capture-stat"><span>Relay</span><strong id="relay-mode">--</strong></div>
          <div class="capture-stat"><span>Bitrate</span><strong id="bitrate">--</strong></div>
          <div class="capture-stat"><span>Listeners</span><strong id="listeners">--</strong></div>
          <div class="capture-stat"><span>Buffered locally</span><strong id="buffered-seconds">0.0 s</strong></div>
          <div class="capture-stat"><span>Behind live</span><strong id="live-latency">--</strong></div>
          <div class="capture-stat"><span>Safe delay</span><strong id="safe-delay">6 s</strong></div>
        </div>
      </main>
    </div>
    <script src="/audio/assets/hls.min.js"></script>
    <script src="/assets/frame-feedback.js?v=feedback-v1"></script>
    <script src="/audio/assets/listen.js?v=near-realtime-feedback-v1" defer></script>
  </body>
</html>
