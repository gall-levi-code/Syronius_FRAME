<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRAME Audio Monitor</title>
    <link rel="icon" href="/audio/assets/frame-logo-square.svg" type="image/svg+xml">
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const key = (value) => String(value).replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
          const aliases = { page: ["page", "bg", "background"], panel: ["panel", "topbar"], panelStrong: ["panel-2", "surface", "surface-strong", "control"], panelMuted: ["panel-muted", "queue"], border: ["border", "line"], borderSoft: ["border-soft"], label: ["label", "muted"], text: ["text", "control-text"], accent: ["accent"], accentStrong: ["accent-strong"], accentSoft: ["accent-soft"], accentBorder: ["accent-border"], accentContrast: ["accent-contrast", "action-text"], danger: ["danger", "bad"], warning: ["warning", "warn"], good: ["good"], toggleNightBg: ["toggle-night-bg"], toggleNightText: ["toggle-night-text"], toggleDayBg: ["toggle-day-bg"], toggleDayText: ["toggle-day-text"] };
          window.FrameTheme = { apply(mode) {
            const stored = mode || localStorage.getItem("frame-theme") || localStorage.getItem("frame-gallery-theme-mode") || localStorage.getItem("frame-audio-bridge-color-mode");
            const theme = stored === "day" || stored === "night" ? stored : "night";
            root.dataset.theme = theme;
            root.dataset.themeMode = theme;
            const palette = JSON.parse(localStorage.getItem("frame-theme-profile") || "null")?.palettes?.[theme];
            if (!palette) return;
            Object.entries(palette).forEach(([name, color]) => {
              root.style.setProperty(`--frame-${key(name)}`, color);
              (aliases[name] || []).forEach((alias) => root.style.setProperty(`--${alias}`, color));
            });
          } };
          window.FrameTheme.apply();
        } catch {}
      })();
    </script>
    <script src="/assets/frame-theme.js?v=global-theme-v1"></script>
    <link rel="stylesheet" href="/audio/assets/styles.css?v=frame-theme-tab">
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><img src="/audio/assets/frame-logo-square.svg" alt="FRAME"><div><strong>Audio Monitor</strong><span>Browser capture and remote listening</span></div></div>
      <div class="top-actions">
        <span id="service-status" class="status-pill">Checking relay</span>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.1A8.4 8.4 0 0 1 8.9 3.6 8.5 8.5 0 1 0 20.4 15.1Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>
    <main>
      <section class="toolbar">
        <div><h1>Audio Sources</h1><p>Create stable capture and listen links for remote stream monitoring.</p></div>
        <div class="toolbar-actions"><button id="add-button">Add audio source</button></div>
      </section>
      <div id="notice" class="notice hidden"></div>
      <section id="stream-list" class="stream-list" aria-live="polite"></section>
    </main>
    <dialog id="stream-dialog">
      <form id="stream-form">
        <div class="dialog-head"><div><strong id="dialog-title">Add audio source</strong><span>Stream IDs become part of stable capture and listen URLs.</span></div><button type="button" class="secondary" id="close-dialog">Close</button></div>
        <div id="dialog-notice" class="notice hidden"></div>
        <div class="form-grid">
          <label class="wide">Source name<input id="name-input" required maxlength="80" placeholder="Main IRL program audio"></label>
          <label class="wide">Stream ID<input id="stream-id-input" required minlength="7" maxlength="64" pattern="[a-z0-9][a-z0-9-]{6,63}" inputmode="text" autocapitalize="none" autocomplete="off" spellcheck="false"><small>Use 7-64 lowercase letters, numbers, or hyphens. Create a new source to change this permanent URL ID.</small></label>
          <label>Listener AAC quality<select id="bitrate-input"><option value="64">64 kbps - Data saver</option><option value="96">96 kbps - Voice</option><option value="128">128 kbps - Balanced</option><option value="160">160 kbps - Good</option><option value="192" selected>192 kbps - High</option><option value="256">256 kbps - Very high</option><option value="320">320 kbps - Maximum</option></select><small>Higher values improve the final encode while increasing bandwidth for every listener.</small></label>
          <label>Listener limit<select id="listener-limit-input" required><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10" selected>10</option></select></label>
          <label class="wide toggle-label"><input id="always-on-input" type="checkbox" checked> Keep listen link alive with silence while capture is offline</label>
        </div>
        <div class="dialog-actions"><button type="button" id="regenerate-button" class="secondary">Regenerate ID</button><button type="submit">Save source</button></div>
      </form>
    </dialog>
    <script src="/audio/assets/admin.js?v=form-polish" defer></script>
  </body>
</html>
