<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071923">
    <title>FRAME Photo Gallery</title>
    <link rel="icon" href="/gallery/assets/frame-logo-square.svg" type="image/svg+xml">
    <script>
      (() => {
        try {
          const root = document.documentElement;
          const key = (value) => String(value).replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
          const aliases = { page: ["page", "bg", "background"], panel: ["panel", "topbar"], panelStrong: ["panel-2", "surface", "surface-strong", "control"], panelMuted: ["panel-muted", "queue"], border: ["border", "line"], borderSoft: ["border-soft"], label: ["label", "muted"], text: ["text", "control-text"], accent: ["accent"], accentStrong: ["accent-strong"], accentSoft: ["accent-soft"], accentBorder: ["accent-border"], accentContrast: ["accent-contrast", "action-text"], danger: ["danger", "bad"], warning: ["warning", "warn"], good: ["good"], toggleNightBg: ["toggle-night-bg"], toggleNightText: ["toggle-night-text"], toggleDayBg: ["toggle-day-bg"], toggleDayText: ["toggle-day-text"] };
          window.FrameTheme = { apply(mode) {
            const stored = mode || localStorage.getItem("frame-theme") || localStorage.getItem("frame-gallery-theme-mode") || localStorage.getItem("frame-audio-bridge-color-mode");
            const theme = stored === "day" || stored === "night" ? stored : "night";
            root.dataset.theme = theme;
            root.dataset.themeMode = theme;
            const palette = JSON.parse(localStorage.getItem("frame-theme-profile") || "null")?.palettes?.[theme];
            if (!palette) return;
            Object.entries(palette).forEach(([name, color]) => {
              root.style.setProperty(`--frame-${key(name)}`, color);
              (aliases[name] || []).forEach((alias) => root.style.setProperty(`--${alias}`, color));
            });
          } };
          window.FrameTheme.apply();
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="/gallery/assets/styles.css?v=gallery-zoom-slider-5">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" id="gallery-home" href="/today/gallery" aria-label="FRAME Photo Gallery">
        <img id="brand-logo" src="/gallery/assets/frame-logo-square.svg" alt="">
        <span><small id="brand-name">Syronius FRAME</small><strong id="gallery-title">Photo Gallery</strong></span>
      </a>
      <div class="topbar-actions">
        <div class="summary">
          <strong id="photo-count">0 photos</strong>
          <span id="refresh-state">Checking gallery...</span>
        </div>
        <button id="theme-toggle" class="icon-toggle theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode"></button>
      </div>
    </header>

    <main>
      <section class="gallery-heading">
        <div>
          <p id="heading-eyebrow">Published galleries</p>
          <h1 id="date-heading">Loading galleries</h1>
          <span id="date-summary" class="date-summary"></span>
        </div>
        <div class="heading-actions">
          <a class="secondary-button" href="/today/gallery/admin">Manage</a>
          <a id="all-galleries" class="secondary-button" href="/today/gallery" hidden>All galleries</a>
        </div>
      </section>

      <section id="empty" class="empty" hidden>
        <strong>No published photos yet</strong>
        <span>Completed photos will appear after the FRAME pipeline publishes them.</span>
      </section>
      <section id="date-gallery" class="date-grid" aria-live="polite"></section>
      <section id="photo-gallery" class="gallery-grid" aria-live="polite" hidden></section>
    </main>

    <dialog id="lightbox" class="lightbox">
      <div id="lightbox-viewport" class="lightbox-viewport">
        <img id="lightbox-image" alt="">
      </div>
      <aside id="lightbox-details" class="lightbox-details"></aside>
      <div class="lightbox-toolbar">
        <div class="lightbox-identity">
          <strong id="lightbox-title"></strong>
          <span id="lightbox-position"></span>
        </div>
        <div class="zoom-controls" aria-label="Image zoom">
          <label for="zoom-slider">Zoom</label>
          <span class="zoom-slider-shell">
            <input id="zoom-slider" type="range" min="25" max="200" step="5" value="100" aria-label="Zoom percentage">
            <output id="zoom-value" for="zoom-slider">Fit</output>
          </span>
          <button id="zoom-fit" class="lightbox-control" type="button">Fit</button>
          <button id="lightbox-close" class="lightbox-control" type="button">Close</button>
        </div>
      </div>
      <button id="lightbox-previous" class="lightbox-control lightbox-nav previous" type="button" aria-label="Previous photo">&lt;</button>
      <button id="lightbox-next" class="lightbox-control lightbox-nav next" type="button" aria-label="Next photo">&gt;</button>
    </dialog>

    <template id="date-template">
      <article class="date-card">
        <a>
          <img alt="" loading="lazy">
          <span class="date-card-copy">
            <strong></strong>
            <span class="date-card-stats"></span>
          </span>
        </a>
      </article>
    </template>
    <template id="photo-template">
      <article class="photo-card">
        <button class="photo-open" type="button">
          <img alt="" loading="lazy">
          <span class="photo-meta"><strong></strong><small></small></span>
        </button>
      </article>
    </template>
    <script type="module" src="/gallery/assets/gallery.js?v=gallery-zoom-slider-8"></script>
  </body>
</html>
