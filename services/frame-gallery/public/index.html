<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071923">
    <title>FRAME Photo Gallery</title>
    <link rel="icon" href="/gallery/assets/frame-logo-square.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/gallery/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" id="gallery-home" href="/today/gallery" aria-label="FRAME Photo Gallery">
        <img src="/gallery/assets/frame-logo-square.svg" alt="">
        <span><small>Syronius FRAME</small><strong>Photo Gallery</strong></span>
      </a>
      <div class="summary">
        <strong id="photo-count">0 photos</strong>
        <span id="refresh-state">Checking gallery...</span>
      </div>
    </header>

    <main>
      <section class="gallery-heading">
        <div>
          <p id="heading-eyebrow">Published galleries</p>
          <h1 id="date-heading">Loading galleries</h1>
          <span id="date-summary" class="date-summary"></span>
        </div>
        <div class="heading-actions">
          <a class="secondary-button" href="/today/gallery/admin">Manage</a>
          <a id="all-galleries" class="secondary-button" href="/today/gallery" hidden>All galleries</a>
          <button id="refresh" class="secondary-button" type="button">Refresh</button>
        </div>
      </section>

      <section id="empty" class="empty" hidden>
        <strong>No published photos yet</strong>
        <span>Completed photos will appear after the FRAME pipeline publishes them.</span>
      </section>
      <section id="date-gallery" class="date-grid" aria-live="polite"></section>
      <section id="photo-gallery" class="gallery-grid" aria-live="polite" hidden></section>
    </main>

    <dialog id="lightbox" class="lightbox">
      <div id="lightbox-viewport" class="lightbox-viewport">
        <img id="lightbox-image" alt="">
      </div>
      <aside id="lightbox-details" class="lightbox-details"></aside>
      <div class="lightbox-toolbar">
        <div class="lightbox-identity">
          <strong id="lightbox-title"></strong>
          <span id="lightbox-position"></span>
        </div>
        <div class="zoom-controls" aria-label="Image zoom">
          <label for="zoom-select">Zoom</label>
          <select id="zoom-select">
            <option value="fit">Fit image</option>
            <option value="25">25%</option>
            <option value="50">50%</option>
            <option value="75">75%</option>
            <option value="100">100%</option>
          </select>
          <button id="zoom-fit" class="lightbox-control" type="button">Fit</button>
          <button id="lightbox-close" class="lightbox-control" type="button">Close</button>
        </div>
      </div>
      <button id="lightbox-previous" class="lightbox-control lightbox-nav previous" type="button" aria-label="Previous photo">&lt;</button>
      <button id="lightbox-next" class="lightbox-control lightbox-nav next" type="button" aria-label="Next photo">&gt;</button>
    </dialog>

    <template id="date-template">
      <article class="date-card">
        <a>
          <img alt="" loading="lazy">
          <span class="date-card-copy">
            <strong></strong>
            <span class="date-card-stats"></span>
          </span>
        </a>
      </article>
    </template>
    <template id="photo-template">
      <article class="photo-card">
        <button class="photo-open" type="button">
          <img alt="" loading="lazy">
          <span class="photo-meta"><strong></strong><small></small></span>
        </button>
      </article>
    </template>
    <script type="module" src="/gallery/assets/gallery.js"></script>
  </body>
</html>
