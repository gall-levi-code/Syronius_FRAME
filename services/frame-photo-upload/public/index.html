<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071923">
    <title>FRAME Photo Upload</title>
    <link rel="icon" href="/photos/assets/frame-logo-square.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/photos/assets/styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/today/dashboard" aria-label="Open Today Dashboard">
        <img src="/photos/assets/frame-logo-square.svg" alt="FRAME">
        <span><small>Syronius FRAME</small><strong>Photo Upload</strong></span>
      </a>
      <div class="header-actions">
        <a class="icon-button" href="/today/dashboard">Today Tools</a>
        <a class="icon-button" href="/auth/logout">Sign out</a>
      </div>
    </header>
    <main>
      <section class="page-heading">
        <p>Photo workflow</p>
        <h1>Upload Photos</h1>
        <span>Queue completed photos from this device into the FRAME pipeline.</span>
      </section>
      <form id="upload-form">
        <label class="drop" for="photo">
          <strong>Select photos</strong>
          <span>JPEG, PNG, WebP, TIFF, HEIC, and HEIF files are queued one at a time.</span>
          <input id="photo" name="photo" type="file" accept="image/jpeg,image/png,image/webp,image/tiff,image/heic,image/heif" multiple required>
        </label>
        <div class="queue-heading">
          <strong>Upload queue</strong>
          <span id="selection">No photos selected</span>
        </div>
        <ol id="queue" class="queue"></ol>
        <button id="upload-button" type="submit">Upload to FRAME</button>
        <p id="status" role="status"></p>
      </form>
    </main>
    <template id="queue-template">
      <li class="queue-item">
        <div class="file-row"><strong></strong><span class="file-state">Ready</span></div>
        <div class="progress-row">
          <progress max="100" value="0"></progress>
          <span class="progress-label">0% &middot; 0 B</span>
        </div>
      </li>
    </template>
    <script src="/photos/assets/upload.js"></script>
  </body>
</html>
