services:
  frame-audio-bridge:
    build: .
    container_name: frame-audio-bridge
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-3728}
      DATA_DIR: /data
      PORTAL_SERVICE_TOKEN: ${PORTAL_SERVICE_TOKEN:-}
    ports:
      - "${PORT:-3728}:${PORT:-3728}"
    volumes:
      - frame-audio-bridge-data:/data

volumes:
  frame-audio-bridge-data:
