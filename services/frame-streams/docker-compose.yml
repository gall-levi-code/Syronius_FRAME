services:
  frame-streams:
    build: .
    container_name: frame-streams
    restart: unless-stopped
    environment:
      PORT: 3732
      DATA_ROOT: /data
      SLS_API_URL: ${SLS_API_URL:-http://host.docker.internal:8080}
      SLS_API_KEY: ${SLS_API_KEY}
      PUBLIC_RELAY_HOST: ${PUBLIC_RELAY_HOST:-localhost}
      SRTLA_PORT: ${SRTLA_PORT:-5000}
      SRT_PLAYER_PORT: ${SRT_PLAYER_PORT:-4000}
      SRT_SENDER_PORT: ${SRT_SENDER_PORT:-4001}
      SLS_STATS_PORT: ${SLS_STATS_PORT:-8080}
      OVERLAY_WIZARD_URL: ${OVERLAY_WIZARD_URL:-http://localhost:3733/overlays/setup}
      OVERLAYS_API_URL: ${OVERLAYS_API_URL:-}
    ports:
      - "${STREAMS_PORT:-3732}:3732"
    volumes:
      - ${STREAMS_DATA_DIR:-./data}:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
