<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRAME Overlay Wizard</title>
    <meta name="theme-color" content="#06131d">
    <link rel="icon" href="/overlays/assets/frame-logo-square.svg" type="image/svg+xml">
    <script>
      (() => {
        try {
          const THEME_MODE_KEY = "frame-theme";
          const LEGACY_PORTAL_THEME_KEY = "frame-portal-theme";
          const THEME_PROFILE_KEY = "frame-theme-profile";
          const COMPAT_THEME_KEYS = ["frame-gallery-theme-mode", "frame-audio-bridge-color-mode"];
          const root = document.documentElement;
          const key = (value) => String(value).replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`);
          const aliases = { page: ["page", "bg", "background"], panel: ["panel", "topbar"], panelStrong: ["panel-2", "surface", "surface-strong", "control"], panelMuted: ["panel-muted", "queue"], border: ["border", "line"], borderSoft: ["border-soft"], label: ["label", "muted"], text: ["text", "control-text"], accent: ["accent"], accentStrong: ["accent-strong"], accentSoft: ["accent-soft"], accentBorder: ["accent-border"], accentContrast: ["accent-contrast", "action-text"], danger: ["danger", "bad"], warning: ["warning", "warn"], good: ["good"], toggleNightBg: ["toggle-night-bg"], toggleNightText: ["toggle-night-text"], toggleDayBg: ["toggle-day-bg"], toggleDayText: ["toggle-day-text"] };
          const readMode = (mode) => {
            const stored = mode || localStorage.getItem(THEME_MODE_KEY) || localStorage.getItem(LEGACY_PORTAL_THEME_KEY) || COMPAT_THEME_KEYS.map((themeKey) => localStorage.getItem(themeKey)).find(Boolean);
            return stored === "day" || stored === "night" ? stored : "night";
          };
          window.FrameTheme = { apply(mode) {
            const theme = readMode(mode);
            root.dataset.theme = theme;
            root.dataset.themeMode = theme;
            document.body?.classList.toggle("theme-day", theme === "day");
            const palette = JSON.parse(localStorage.getItem(THEME_PROFILE_KEY) || "null")?.palettes?.[theme];
            if (!palette) return;
            Object.entries(palette).forEach(([name, color]) => {
              root.style.setProperty(`--frame-${key(name)}`, color);
              (aliases[name] || []).forEach((alias) => root.style.setProperty(`--${alias}`, color));
            });
            document.querySelector('meta[name="theme-color"]')?.setAttribute("content", palette.page || "#06131d");
            return theme;
          } };
          window.FrameTheme.apply();
        } catch {}
      })();
    </script>
    <script src="/assets/frame-theme.js?v=global-theme-v1"></script>
    <link rel="stylesheet" href="/overlays/assets/styles.css?v=portal-theme-v2-upload-editor-v2">
  </head>
  <body>
    <header class="topbar">
      <a id="dashboard-link" class="brand brand-link" href="/dashboard" aria-label="Open FRAME dashboard">
        <img src="/overlays/assets/frame-logo-square.svg" alt="" aria-hidden="true">
        <div><strong>Overlay Wizard</strong><span>OBS browser sources</span></div>
      </a>
      <div class="top-actions">
        <span id="receiver-status" class="status-pill">Checking telemetry</span>
        <span id="save-status" class="status-pill hidden">Saved</span>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to day mode" title="Switch to day mode">
          <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </header>

    <main class="wizard-shell">
      <div id="notice" class="notice hidden" role="status"></div>
      <section id="source-tabs-shell" class="source-tabs-shell hidden" aria-label="OBS overlay sources">
        <nav id="source-tabs" class="source-tabs" role="tablist"></nav>
      </section>
      <section id="main-content" class="wizard-content"></section>
      <section id="preview-dock" class="preview-dock hidden" aria-label="Renderer preview">
        <div class="preview-head">
          <div class="preview-title-row">
            <div><strong>Renderer preview</strong><span id="preview-caption">Sample output</span></div>
            <label class="fake-toggle"><input id="fake-preview-toggle" type="checkbox" checked>Use fake data</label>
          </div>
          <div id="upload-preview-tools" class="preview-tools" hidden>
            <div class="view-mode-toggle preview-view-toggle" role="group" aria-label="Preview framing">
              <button type="button" class="active" data-preview-view="canvas" aria-pressed="true">Canvas</button>
              <button type="button" data-preview-view="detail" aria-pressed="false">Detail</button>
            </div>
            <label class="preview-scenario-field" for="preview-scenario"><span>Scene</span><select id="preview-scenario">
              <option value="queue">Queue</option>
              <option value="uploading">Uploading</option>
              <option value="staged">Staged</option>
              <option value="processing">Processing</option>
              <option value="failed">Failed</option>
              <option value="completed">Completed</option>
              <option value="idle">Idle</option>
            </select></label>
          </div>
        </div>
        <div class="preview-frame-shell">
          <div id="preview-scale-shell" class="preview-scale-shell">
            <iframe id="preview-frame" title="Overlay renderer preview" allowtransparency="true"></iframe>
          </div>
        </div>
      </section>
    </main>

    <dialog id="confirm-dialog">
      <div class="dialog-head">
        <div><strong id="confirm-title">Confirm action</strong><span id="confirm-subtitle"></span></div>
        <button type="button" class="icon-button close-button" id="confirm-cancel-x" aria-label="Close confirmation dialog" title="Close"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="confirm-body" class="dialog-copy"></div>
      <div class="dialog-actions">
        <button type="button" class="secondary" id="confirm-cancel">Cancel</button>
        <button type="button" id="confirm-accept">Confirm</button>
      </div>
    </dialog>

    <script type="module" src="/overlays/assets/app.js?v=upload-editor-v5"></script>
  </body>
</html>
