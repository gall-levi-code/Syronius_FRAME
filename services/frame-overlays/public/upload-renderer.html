<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FRAME Overlay</title>
    <link rel="stylesheet" href="/overlays/assets/renderer.css?v=upload-editor-v2">
    <link rel="stylesheet" href="/overlays/assets/upload-renderer.css?v=upload-editor-v5">
  </head>
  <body>
    <div class="overlay-root">
      <div id="upload-stack" class="upload-stack">
        <section id="journey-region" class="journey-region" aria-label="Photo upload journeys">
          <div id="journey-list" class="journey-list" role="list" aria-live="polite"></div>
          <div id="queue-overflow" class="queue-overflow" hidden></div>
          <div id="idle-bubble" class="journey-bubble idle-bubble" hidden>
            <strong id="idle-label">WAITING FOR UPLOAD</strong>
            <span id="idle-source">FRAME Uploads</span>
          </div>
        </section>
      </div>
      <div id="completion-dock" class="completion-dock">
        <div id="completion-bubble" class="completion-bubble" role="status" aria-live="polite" hidden>
          <span class="completion-icon" aria-hidden="true">&#10003;</span>
          <span><strong id="completion-title">Completed</strong><small id="completion-file"></small></span>
        </div>
      </div>
    </div>
    <script>window.FRAME_OVERLAY = /*__FRAME_OVERLAY_CONFIG__*/null;</script>
    <script type="module" src="/overlays/assets/upload-renderer.js?v=upload-editor-v5"></script>
  </body>
</html>
