name: Verify FRAME

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run verify

  services:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - frame-audio
          - frame-audio-bridge
          - frame-overlays
          - frame-portal
          - frame-streams
          - frame-pipeline-photos
          - frame-photo-upload
          - frame-photo-ftp
          - frame-gallery
          - frame-today
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - if: contains(fromJSON('["frame-audio","frame-pipeline-photos","frame-photo-upload","frame-photo-ftp","frame-gallery","frame-today"]'), matrix.service)
        run: npm test
