name: Build FRAME launcher candidates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: win
            platform: win
            arch: x64
            artifacts: apps/frame-setup/release/*.exe
          - os: ubuntu-22.04
            target: linux
            platform: linux
            arch: x64
            artifacts: apps/frame-setup/release/*.AppImage
          - os: macos-15-intel
            target: mac:x64
            platform: mac
            arch: x64
            artifacts: |
              apps/frame-setup/release/*.dmg
              apps/frame-setup/release/*.zip
          - os: macos-15
            target: mac:arm64
            platform: mac
            arch: arm64
            artifacts: |
              apps/frame-setup/release/*.dmg
              apps/frame-setup/release/*.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/frame-setup/package-lock.json
      - run: node --test tests/electron-*.test.mjs tests/frame-preflight.test.mjs tests/installer-host-runtime.test.mjs
      - run: npm ci
        working-directory: apps/frame-setup
      - name: Build Windows or Linux installer
        if: runner.os != 'macOS'
        run: npm run dist:${{ matrix.target }}
        working-directory: apps/frame-setup
      # macOS CI artifacts are unsigned unless the optional Developer ID secrets are configured.
      # electron-builder notarizes signed builds when all three Apple credentials are supplied.
      - name: Build macOS installers (unsigned unless signing secrets are configured)
        if: runner.os == 'macOS'
        run: npm run dist:${{ matrix.target }}
        working-directory: apps/frame-setup
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.MAC_CSC_LINK != '' && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Native Windows or macOS shell smoke (isolated simulated backend)
        if: runner.os != 'Linux'
        timeout-minutes: 2
        working-directory: apps/frame-setup
        run: npm run smoke:native
        env:
          FRAME_EXPECTED_ARCH: ${{ matrix.arch }}
          FRAME_SMOKE_REPORT: release/native-smoke-${{ matrix.platform }}-${{ matrix.arch }}.json
      - name: Native Ubuntu 22.04 shell smoke (sandbox enabled; isolated simulated backend)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        working-directory: apps/frame-setup
        run: xvfb-run --auto-servernum npm run smoke:native
        env:
          FRAME_EXPECTED_ARCH: ${{ matrix.arch }}
          FRAME_SMOKE_REPORT: release/native-smoke-${{ matrix.platform }}-${{ matrix.arch }}.json
      - name: Verify candidate filenames and record SHA-256 checksums
        working-directory: apps/frame-setup
        run: node scripts/check-artifacts.mjs ${{ matrix.platform }} ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: FRAME-Setup-${{ matrix.platform }}-${{ matrix.arch }}-candidate
          path: |
            ${{ matrix.artifacts }}
            apps/frame-setup/release/SHA256SUMS-*.txt
            apps/frame-setup/release/artifact-check-*.json
            apps/frame-setup/release/native-smoke-*.json
          if-no-files-found: error
