services:
  overlay:
    build: .
    container_name: obs-connectivity-overlay
    ports:
      - "8280:8080"
    environment:
      UPSTREAM_URL: "https://your-json-endpoint.example.com/status"
      OVERLAY_TOKEN=supersecrettoken
      # AUTH_HEADER: "Bearer abc123"
      # CUSTOM_HEADERS: '{"X-Api-Key":"secret"}'
    restart: unless-stopped
