[package]
name = "frame-setup"
version = "0.1.0"
description = "Native FRAME setup and launcher"
authors = ["Syronius FRAME"]
edition = "2021"

[lib]
name = "frame_setup_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
